<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hardoil</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-bg" aria-hidden="true"></div>

  <main class="app" id="app">
    <!-- Asosiy -->
    <section class="panel active" id="panel-home" data-panel="home">
      <div class="hero-icon">🛢️</div>
      <header class="user-greeting">
        <div class="avatar" id="user-avatar"></div>
        <div>
          <h1 class="greeting" id="greeting-text">Salom!</h1>
          <p class="greeting-sub" id="welcome-text"></p>
        </div>
      </header>

      <div class="badge">Hardoil mijozi</div>

      <h2 class="section-title" id="services-title"></h2>
      <div class="service-cards" id="service-cards"></div>
    </section>

    <!-- Katalog -->
    <section class="panel" id="panel-catalog" data-panel="catalog">
      <div class="panel-hero">
        <div class="hero-icon small">📦</div>
        <h1 class="panel-title" id="catalog-title"></h1>
        <p class="panel-subtitle" id="catalog-subtitle"></p>
      </div>

      <div class="catalog-header">
        <span class="catalog-label" id="catalog-section-label"></span>
        <div class="view-toggle">
          <button type="button" class="view-btn active" data-view="grid" aria-label="Grid">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
          </button>
          <button type="button" class="view-btn" data-view="list" aria-label="List">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
          </button>
        </div>
      </div>

      <div class="catalog-grid" id="catalog-grid"></div>
    </section>

    <!-- Boshqa -->
    <section class="panel" id="panel-other" data-panel="other">
      <div class="panel-hero">
        <div class="hero-icon small">📋</div>
        <h1 class="panel-title" id="other-title"></h1>
        <p class="panel-subtitle" id="other-subtitle"></p>
      </div>
      <nav class="menu-list" id="other-menu"></nav>
    </section>

    <!-- Sub: Manzil -->
    <section class="panel sub-panel" id="panel-location" data-panel="location">
      <button type="button" class="back-btn" data-back>← Orqaga</button>
      <h1 class="panel-title" id="location-title"></h1>
      <div class="info-card">
        <p class="info-row"><span>📍</span> <span id="location-address"></span></p>
        <p class="info-row"><span>🕐</span> <span id="location-hours"></span></p>
        <p class="info-row"><span>📞</span> <a id="location-phone" href="#"></a></p>
      </div>
      <a class="cta-btn" id="location-map" href="#" target="_blank" rel="noopener">Xaritada ochish</a>
    </section>

    <!-- Sub: Feedback -->
    <section class="panel sub-panel" id="panel-feedback" data-panel="feedback">
      <button type="button" class="back-btn" data-back>← Orqaga</button>
      <h1 class="panel-title" id="feedback-title"></h1>
      <p class="panel-subtitle" id="feedback-subtitle"></p>
      <form class="feedback-form" id="feedback-form">
        <label>
          <span id="label-name"></span>
          <input type="text" name="name" required autocomplete="name" />
        </label>
        <label>
          <span id="label-phone"></span>
          <input type="tel" name="phone" required autocomplete="tel" placeholder="+998" />
        </label>
        <label>
          <span id="label-message"></span>
          <textarea name="message" rows="4" required></textarea>
        </label>
        <button type="submit" class="cta-btn" id="feedback-submit"></button>
      </form>
      <p class="form-status hidden" id="form-status"></p>
    </section>
  </main>

  <!-- Media modal -->
  <div class="modal hidden" id="media-modal" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <button type="button" class="modal-close" data-close-modal aria-label="Yopish">×</button>
      <h3 class="modal-title" id="modal-title"></h3>
      <div class="modal-media" id="modal-media"></div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav" id="bottom-nav">
    <button type="button" class="nav-item active" data-tab="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label" data-tab-label="home"></span>
    </button>
    <button type="button" class="nav-item" data-tab="catalog">
      <span class="nav-icon">📦</span>
      <span class="nav-label" data-tab-label="catalog"></span>
    </button>
    <button type="button" class="nav-item" data-tab="other">
      <span class="nav-icon">☰</span>
      <span class="nav-label" data-tab-label="other"></span>
    </button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
